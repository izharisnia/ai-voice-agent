<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>⚡ Electric Voice Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/wavesurfer.js"></script>
</head>
<body>
  <div class="app-grid">
    <aside id="chatHistory" class="card sidebar">
      <div class="history-header">
        <h3>Conversations</h3>
        <div class="history-controls">
          <button id="newChatBtn" class="glow-button small">+ New Chat</button>
          <button id="clearHistoryBtn" class="glow-button small">Clear</button>
        </div>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </aside>

    <main class="container">
      <section class="card glow-card agent-card">
        <h2>🤖 Conversational Voice Agent</h2>

        <div class="controls">
          <div class="record-row">
            <button id="recordToggleBtn" class="glow-button primary" aria-pressed="false">
              <span id="recordBtnLabel">Start Recording</span>
            </button>
            <div class="mode-select" style="display: flex; align-items: center; margin: 0 10px;">
              <label style="font-size: 0.85rem; color: #a0a0ff; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="wsModeToggle" checked /> ⚡ Real-Time WS Mode
              </label>
            </div>
            <div class="status-pill" id="statusText">
              <span class="status-dot idle"></span> Idle
            </div>
            <div class="settings">
              <button id="settingsBtn" class="glow-button small">⚙️ Keys</button>
            </div>
          </div>
        </div>

        <div id="waveformEcho" class="waveform big"></div>

        <div class="llm-box">
          <div class="llm-header">🔊 LLM Response:</div>
          <div id="skillResult" class="skill-result"></div>
          <audio id="llmAudioPlayer" controls style="display:block; margin-top:12px; width: 100%;"></audio>
        </div>
      </section>

      <section class="card glow-card transcription-card">
        <h2>📝 Transcription</h2>
        <div id="transcript" class="transcription-box">
          <p class="placeholder">Your transcription will appear here...</p>
        </div>
      </section>

      <footer>
        <p>Built by <strong>Isnia Izhar</strong> | Electric Voice Agent</p>
      </footer>
    </main>
  </div>

  <!-- Settings modal (API keys) -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h3>Configure API Keys</h3>
      <p style="font-size:0.8rem; color:#88a; margin-bottom:12px;">Saved locally in browser. Sent to backend for custom API authentication.</p>
      <label>AssemblyAI Key<br><input id="cfg_assembly" type="password" placeholder="Defaults to server .env" /></label>
      <label>Gemini Key<br><input id="cfg_gemini" type="password" placeholder="Defaults to server .env" /></label>
      <label>Murf Key<br><input id="cfg_murf" type="password" placeholder="Defaults to server .env" /></label>
      <label>News API Key (optional)<br><input id="cfg_news" type="password" placeholder="Defaults to server .env" /></label>
      <div class="modal-actions">
        <button id="saveKeysBtn" class="glow-button small">Save</button>
        <button id="closeModalBtn" class="glow-button small">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/scripts.js" defer></script>
</body>
</html>
